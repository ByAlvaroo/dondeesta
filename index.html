<div class="toasts" id="toasts"></div>
<script>
/* Lee js/config.js como texto y saca el firebaseConfig, lo pegues como lo pegues
   (con o sin las líneas de import/initializeApp que da Firebase). */
(function () {
  var V = "1.0.2";
  function load(src) { return new Promise(function (ok, ko) { var s = document.createElement("script"); s.src = src + "?v=" + V; s.onload = ok; s.onerror = ko; document.body.appendChild(s); }); }
  function pick(txt) {
    txt = txt.replace(/\/\*[\s\S]*?\*\//g, "").replace(/^\s*\/\/.*$/gm, "");
    var m = txt.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})\s*;?/) || txt.match(/FIREBASE\s*:\s*(\{[\s\S]*?\})/);
    if (!m) return null;
    try { return Function('"use strict";return (' + m[1] + ")")(); } catch (e) { return null; }
  }
  fetch("js/config.js?v=" + V + "&t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .catch(function () { return ""; })
    .then(function (txt) {
      var fb = pick(txt || "");
      window.DONDE_CONFIG = { FIREBASE: fb || {} };
      return load("js/qr.js");
    })
    .then(function () { return load("js/data.js"); })
    .then(function () { return load("js/app.js"); });
})();
</script>
